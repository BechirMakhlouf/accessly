name: "[Supabase] Deploy Edge Function"

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
    # paths:
    #   - "supabase/functions/**"
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy to"
        required: true
        type: environment

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    steps:
      - uses: actions/checkout@v4

      - name: Check if functions exist
        id: check_functions
        run: |
          if [ -d "supabase/functions" ] && [ "$(ls -A supabase/functions 2>/dev/null)" ]; then
            echo "functions_exist=true" >> $GITHUB_OUTPUT
            echo "✅ Functions directory exists with content"
          else
            echo "functions_exist=false" >> $GITHUB_OUTPUT
            echo "⚠️ No functions to deploy"
          fi

      - uses: supabase/setup-cli@v1
        if: steps.check_functions.outputs.functions_exist == 'true'
        with:
          version: latest

      - name: Deploy functions
        if: steps.check_functions.outputs.functions_exist == 'true'
        run: supabase functions deploy --project-ref $SUPABASE_PROJECT_REF
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF}}
