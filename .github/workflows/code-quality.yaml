jobs:
  code-quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Type check
        run: npm run type-check

      - name: Check for console.log statements
        run: |
          if grep -r "console\.log" src/ --exclude-dir=node_modules; then
            echo "❌ Found console.log statements. Please remove them before committing."
            exit 1
          else
            echo "✅ No console.log statements found."
          fi

      - name: Check for TODO/FIXME comments
        run: |
          echo "📝 Found TODO/FIXME comments:"
          grep -r "TODO\|FIXME" src/ --exclude-dir=node_modules || echo "No TODO/FIXME comments found"

      # - name: Check for hardcoded strings
      #   run: |
      #     echo "🔍 Checking for potential hardcoded strings (excluding config files):"
      #     grep -r "['\"][A-Z][a-z].*['\"]" src/ --exclude-dir=node_modules --exclude="*.config.*" --exclude="*.json" | head -10 || echo "No obvious hardcoded strings found"

      - name: Check file sizes
        run: |
          echo "📊 Large files (>100KB):"
          find src/ -type f -size +100k -not -path "*/node_modules/*" | head -5 || echo "No large files found"

      - name: Check for unused imports
        run: |
          npx ts-unused-exports tsconfig.json --excludePathsFromReport=node_modules || true

      - name: Security audit
        run: npm audit --audit-level=moderate

      - name: Check for secrets
        run: |
          # Check for potential secrets in code
          if grep -r -i "password\|secret\|key\|token" src/ --exclude-dir=node_modules --exclude="*.test.*" --exclude="*.spec.*" | grep -v "process.env" | grep -v "//" | grep -v "/*"; then
            echo "⚠️  Potential secrets found. Please review and use environment variables instead."
          else
            echo "✅ No obvious secrets found in code."
          fi

