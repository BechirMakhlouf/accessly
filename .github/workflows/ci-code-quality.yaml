name: "[CI] Web App Code Quality"

on:
  pull_request:
    branches: [main]
    paths:
      - "apps/web/**"
      - "packages/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
  workflow_dispatch:
env:
  NODE_VERSION: "22"
  NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
  NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0"
  SUPABASE_SECRET_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImV4cCI6MTk4MzgxMjk5Nn0.EGIM96RAZx35lJzdJsyH-qQwv8Hdp7fsn3W0YpN81IU"
  NEXT_PUBLIC_SENTRY_DSN: "https://8e209ebf1110543bd2f9d936e511d674@o4509983333089280.ingest.de.sentry.io/4509983335120976"
  RESEND_API_KEY: "re_test_key_for_ci"
  MAIL_FROM_DOMAIN: "mail.accessly.me"

jobs:
  web-code-quality:
    name: Web App Code Quality Checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.0.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint for web app
        run: pnpm --filter @accessly/web run ci:lint

      - name: Type check for web app
        run: pnpm --filter @accessly/web run ci:type-check

      - name: Check for unused imports
        run: |
          cd apps/web
          npx ts-unused-exports tsconfig.json --excludePathsFromReport=node_modules || true

      - name: Check for secrets
        run: |
          # Check for potential secrets in web app code
          if grep -r -i "password\|secret\|key\|token" apps/web/src/ --exclude-dir=node_modules --exclude="*.test.*" --exclude="*.spec.*" | grep -v "process.env" | grep -v "//" | grep -v "/*"; then
            echo "⚠️  Potential secrets found in web app. Please review and use environment variables instead."
          else
            echo "✅ No obvious secrets found in web app code."
          fi
