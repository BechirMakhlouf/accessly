name: "[Supabase] Run Database Tests"

on:
  pull_request:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - "supabase/schemas/**"
      - "supabase/tests/**"
  workflow_dispatch:

jobs:
  # Database tests
  database-tests:
    name: Database Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Cache Docker images
        uses: ScribeMD/docker-cache@0.5.0
        with:
          key: docker-${{ runner.os }}-${{ hashFiles('.github/workflows/database-tests.yaml') }}
      - run: supabase start -x=storage-api,imgproxy,inbucket,edge-runtime,logflare,vector
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache Supabase
        uses: actions/cache@v4
        with:
          path: |
            ~/.supabase
            ~/.local/share/supabase
          key: supabase-${{ hashFiles('supabase/config.toml', 'supabase/migrations/*.sql') }}
          restore-keys: |
            supabase-

      - name: Start Supabase
        run: supabase start
        env:
          SUPABASE_DEBUG: 1

      - name: Wait for Supabase to be ready
        run: |
          timeout 60 bash -c 'until supabase status | grep -q "API URL"; do sleep 2; done'
          echo "✅ Supabase is ready"

      - name: Show Supabase status
        run: supabase status

      - name: Run database tests
        run: supabase test db
        env:
          SUPABASE_DEBUG: 1

      - name: Stop Supabase
        if: always()
        run: supabase stop
