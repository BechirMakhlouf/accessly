name: "[Supabase] Push Config"

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
    # paths:
    #   - "supabase/config.toml"
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy to"
        required: true
        type: environment
jobs:
  push-config:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      SUPABASE_ACCESS_TOKEN: ${{ vars.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_CONFIG_OAUTH_GOOGLE_CLIENT_SECRET: ${{ vars.SUPABASE_CONFIG_OAUTH_GOOGLE_CLIENT_SECRET }}
      SUPABASE_CONFIG_OAUTH_GOOGLE_CLIENT_ID: ${{ vars.SUPABASE_CONFIG_OAUTH_GOOGLE_CLIENT_ID }}
      SUPABASE_CONFIG_SITE_URL: ${{ vars.SUPABASE_CONFIG_SITE_URL }}
      SUPABASE_CONFIG_OAUTH_SLACK_CLIENT_ID: ${{ vars.SUPABASE_CONFIG_OAUTH_SLACK_CLIENT_ID }}
      SUPABASE_CONFIG_OAUTH_SLACK_CLIENT_SECRET: ${{ vars.SUPABASE_CONFIG_OAUTH_SLACK_CLIENT_SECRET }}
      SUPABASE_CONFIG_OAUTH_CALLBACK_URI: ${{ vars.SUPABASE_CONFIG_OAUTH_CALLBACK_URI }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - run: supabase config push --project-ref $SUPABASE_PROJECT_REF
