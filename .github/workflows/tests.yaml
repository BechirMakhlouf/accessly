  NODE_VERSION: '20'
  NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
  NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0"
  SUPABASE_SECRET_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImV4cCI6MTk4MzgxMjk5Nn0.EGIM96RAZx35lJzdJsyH-qQwv8Hdp7fsn3W0YpN81IU"
  NEXT_PUBLIC_SENTRY_DSN: "https://8e209ebf1110543bd2f9d936e511d674@o4509983333089280.ingest.de.sentry.io/4509983335120976"
  RESEND_API_KEY: "re_test_key_for_ci"
  MAIL_FROM_DOMAIN: "mail.accessly.me"

jobs:
  # Lint and Type Check
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

  # Build verification
  build:
    name: Build Verification
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: lint-and-typecheck

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-files
          path: .next/
          retention-days: 1

  # Database tests
  database-tests:
    name: Database Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Cache Supabase
        uses: actions/cache@v4
        with:
          path: |
            ~/.supabase
            ~/.local/share/supabase
          key: supabase-${{ hashFiles('supabase/config.toml', 'supabase/migrations/*.sql', 'supabase/schemas/*.sql') }}
          restore-keys: |
            supabase-

      - name: Start Supabase
        run: supabase start
        env:
          SUPABASE_DEBUG: 1

      - name: Wait for Supabase to be ready
        run: |
          timeout 60 bash -c 'until supabase status | grep -q "API URL"; do sleep 2; done'
          echo "Supabase is ready"

      - name: Run database tests
        run: supabase test db
        env:
          SUPABASE_DEBUG: 1

      - name: Stop Supabase
        if: always()
        run: supabase stop