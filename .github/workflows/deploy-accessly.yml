name: Accessly Release Pipeline

on:
  workflow_call:
    inputs:
      environment:
        description: "Target environment name"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy to"
        required: true
        type: environment

jobs:
  apply_migrations:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    uses: ./.github/workflows/supabase-apply-migrations.yaml
    secrets:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

  push_config:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    uses: ./.github/workflows/supabase-push-config.yaml
    secrets:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_CONFIG_OAUTH_GOOGLE_CLIENT_SECRET: ${{ secrets.SUPABASE_CONFIG_OAUTH_GOOGLE_CLIENT_SECRET }}
      SUPABASE_CONFIG_OAUTH_GOOGLE_CLIENT_ID: ${{ secrets.SUPABASE_CONFIG_OAUTH_GOOGLE_CLIENT_ID }}
      SUPABASE_CONFIG_SITE_URL: ${{ secrets.SUPABASE_CONFIG_SITE_URL }}
      SUPABASE_CONFIG_OAUTH_SLACK_CLIENT_ID: ${{ secrets.SUPABASE_CONFIG_OAUTH_SLACK_CLIENT_ID }}
      SUPABASE_CONFIG_OAUTH_SLACK_CLIENT_SECRET: ${{ secrets.SUPABASE_CONFIG_OAUTH_SLACK_CLIENT_SECRET }}
      SUPABASE_CONFIG_OAUTH_CALLBACK_URI: ${{ secrets.SUPABASE_CONFIG_OAUTH_CALLBACK_URI }}

  deploy_edge_functions:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    uses: ./.github/workflows/supabase-deploy-edge-functions.yaml
    secrets:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}

  deploy_service:
    runs-on: ubuntu-latest
    needs: [apply_migrations, push_config, deploy_edge_functions]
    environment: ${{ inputs.environment }}
    uses: ./.github/workflows/deploy-service-digitalocean.yaml
    secrets:
      DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

  deploy_web:
    needs: deploy_service
    environment: ${{ inputs.environment }}
    uses: ./.github/workflows/deploy-web-vercel.yaml
    secrets:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

