name: Accessly Release Pipeline

on:
  workflow_call:
    inputs:
      environment:
        description: "Target environment name"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy to"
        required: true
        type: environment

jobs:
  apply_migrations:
    uses: ./.github/workflows/supabase-apply-migrations.yaml
    with:
      environment: ${{ inputs.environment }}
    secrets: inherit

  push_config:
    uses: ./.github/workflows/supabase-push-config.yaml
    with:
      environment: ${{ inputs.environment }}
    secrets: inherit

  deploy_edge_functions:
    uses: ./.github/workflows/supabase-deploy-edge-functions.yaml
    with:
      environment: ${{ inputs.environment }}
    secrets: inherit

  deploy_service:
    needs: [apply_migrations, push_config, deploy_edge_functions]
    uses: ./.github/workflows/digitalocean-deploy-service.yaml
    with:
      environment: ${{ inputs.environment }}
    secrets: inherit

  deploy_web:
    needs: deploy_service
    uses: ./.github/workflows/vercel-deploy-web.yaml
    with:
      environment: ${{ inputs.environment }}
    secrets: inherit
