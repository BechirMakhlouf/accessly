name: Push Supabase Config
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  push-config:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_CONFIG_OAUTH_GOOGLE_CLIENT_SECRET: ${{ secrets.SUPABASE_CONFIG_OAUTH_GOOGLE_CLIENT_SECRET }}
      SUPABASE_CONFIG_OAUTH_GOOGLE_CLIENT_ID: ${{ secrets.SUPABASE_CONFIG_OAUTH_GOOGLE_CLIENT_ID }}
      SUPABASE_CONFIG_SITE_URL: ${{ secrets.SUPABASE_CONFIG_SITE_URL }}
      SUPABASE_CONFIG_OAUTH_SLACK_CLIENT_ID: ${{ secrets.SUPABASE_CONFIG_SLACK_CLIENT_ID }}
      SUPABASE_CONFIG_OAUTH_SLACK_CLIENT_SECRET: ${{ secrets.SUPABASE_CONFIG_SLACK_CLIENT_SECRET }}
      SUPABASE_CONFIG_OAUTH_CALLBACK_URI: ${{ secrets.SUPABASE_CONFIG_OAUTH_CALLBACK_URI }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - run: supabase config push --project-ref $SUPABASE_PROJECT_REF
