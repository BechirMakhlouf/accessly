name: Deploy Production

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

jobs:
  release:
    if: startsWith(github.ref, 'refs/tags/v') && github.event.base_ref == 'refs/heads/main'
    name: Accessly Production Release
    uses: ./.github/workflows/deploy-accessly.yml
    secrets: inherit
    with:
      environment: production
